<object data="{{ site.baseurl }}/{{ include.file }}" type="application/pdf" style="width:{{ include.width }}%; height:{{ include.height }}px; border: none;">
  <iframe src="{{ site.baseurl }}/{{ include.file }}" style="width:{{ include.width }}%; height:{{ include.height }}px; border: none;">
    <p>Your browser does not support embedded PDFs. You can <a href="{{ site.baseurl }}/{{ include.file }}">download the PDF here</a>.</p>
  </iframe>
</object>
